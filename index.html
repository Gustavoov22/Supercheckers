<style>
html,body{background:#000;margin:0}
#sc-root{--hatch-widget-bg:#000;--hatch-widget-text:#f4f1e8;--hatch-widget-muted:#a09a8a;--hatch-widget-border:#2b2b2e;--hatch-widget-surface:#141416;--hatch-widget-surface-muted:#1e1e21;--hatch-widget-accent:#e8b64c;--hatch-widget-on-accent:#1a1206;--hatch-widget-focus:#e8b64c;--hatch-widget-shadow:0 10px 30px rgba(0,0,0,.6);background:#000}
#sc-root{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--hatch-widget-text);width:100%;max-width:560px;margin:0 auto;padding:16px 14px 30px;display:flex;flex-direction:column;gap:12px;align-items:center}
#sc-root *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
.sc-brand{display:flex;flex-direction:column;align-items:center;gap:0;margin-top:4px}
.sc-logo{width:46px;height:46px;border-radius:15px;background:linear-gradient(145deg,#f5c542,#b8860b);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(232,182,76,.35)}
.sc-logo svg{width:26px;height:26px;color:#1a1206}
.sc-title{font-size:25px;font-weight:800;margin:8px 0 0;letter-spacing:.16em}
.sc-title .gold{color:var(--hatch-widget-accent)}
.sc-sub{font-size:11px;color:var(--hatch-widget-muted);margin:4px 0 0;letter-spacing:.14em;text-transform:uppercase}
.sc-infobar{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--hatch-widget-surface);border:1px solid var(--hatch-widget-border);border-radius:16px;padding:10px 14px}
.sc-turn{display:flex;align-items:center;gap:9px;font-weight:700;font-size:14px;min-width:0}
.sc-turn-dot{width:12px;height:12px;border-radius:50%;flex:none}
.sc-turn-dot.r{background:#ff5a52;box-shadow:0 0 10px #ff5a52;animation:sc-pulse 1.6s infinite}
.sc-turn-dot.b{background:#ececf0;box-shadow:0 0 10px rgba(236,236,240,.8);animation:sc-pulse 1.6s infinite}
@keyframes sc-pulse{0%,100%{opacity:1}50%{opacity:.4}}
#sc-turn-label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-infobar-meta{display:flex;gap:6px;align-items:center;flex:none}
.sc-chip{font-size:12px;font-weight:600;color:var(--hatch-widget-muted);background:var(--hatch-widget-surface-muted);border:1px solid var(--hatch-widget-border);border-radius:999px;padding:5px 10px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.sc-minidot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.sc-minidot.r{background:radial-gradient(circle at 35% 30%,#ff8a80,#d21f26 72%)}
.sc-minidot.b{background:radial-gradient(circle at 35% 30%,#9a9aa0,#0c0c0e 72%)}
.sc-area{display:grid;grid-template-columns:22px 1fr;grid-template-rows:1fr 22px;gap:4px;width:min(94vw,460px)}
.sc-ranks{display:flex;flex-direction:column;justify-content:space-around;font-size:10px;font-weight:700;color:var(--hatch-widget-muted);text-align:center}
.sc-files{display:flex;justify-content:space-around;font-size:10px;font-weight:700;color:var(--hatch-widget-muted);grid-column:2;text-align:center}
.sc-board{display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(10,1fr);aspect-ratio:1/1;border-radius:14px;overflow:hidden;border:6px solid #2a1e10;box-shadow:var(--hatch-widget-shadow),0 0 0 1px #3d3d42;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.sc-sq{position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer;min-width:0;min-height:0}
.sc-sq.l{background:#e9d6a8}
.sc-sq.d{background:#8f5f36}
.sc-pc{width:76%;height:76%;border-radius:50%;position:relative;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 6px rgba(0,0,0,.45),inset 0 2px 3px rgba(255,255,255,.28),inset 0 -3px 5px rgba(0,0,0,.35)}
.sc-pc.r{background:radial-gradient(circle at 35% 28%,#ff9a90,#e5322b 62%,#a3121a)}
.sc-pc.b{background:radial-gradient(circle at 35% 28%,#7a7a82,#2a2a2e 62%,#060607)}
.sc-pc.q{outline:3px solid #f5c542;outline-offset:-3px}
.sc-pc.q svg{width:56%;height:56%;color:#f5c542;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.sc-sq.sel{box-shadow:inset 0 0 0 3px #f5c542,inset 0 0 22px rgba(245,197,66,.6)}
.sc-sq.hsrc{box-shadow:inset 0 0 0 3px #30d158,inset 0 0 18px rgba(48,209,88,.5)}
.sc-sq.hdst{box-shadow:inset 0 0 0 3px #f5c542,inset 0 0 18px rgba(245,197,66,.5)}
.sc-sq.hcap{box-shadow:inset 0 0 0 3px #ff453a,inset 0 0 18px rgba(255,69,58,.55)}
.sc-dot{position:absolute;width:26%;height:26%;border-radius:50%;background:radial-gradient(circle,rgba(245,197,66,.95) 30%,rgba(245,197,66,.25) 70%);pointer-events:none;box-shadow:0 0 8px rgba(245,197,66,.5)}
.sc-controls{width:100%;display:flex;flex-direction:column;gap:10px;align-items:stretch}
.sc-card{background:var(--hatch-widget-surface);border:1px solid var(--hatch-widget-border);border-radius:18px;padding:12px 16px;width:100%}
.sc-card-label{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--hatch-widget-muted);text-transform:uppercase;margin-bottom:6px}
.sc-card-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 0}
.sc-card-row + .sc-card-row{border-top:1px solid var(--hatch-widget-border)}
.sc-switch{position:relative;display:flex;align-items:center;gap:12px;font-size:14px;font-weight:600;cursor:pointer;user-select:none}
.sc-switch input{position:absolute;opacity:0;width:0;height:0}
.sc-switch .tk{width:46px;height:27px;border-radius:14px;background:#2c2c2e;border:1px solid var(--hatch-widget-border);position:relative;flex:none;transition:background .18s}
.sc-switch .tk::after{content:'';position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;background:#8e8e93;transition:left .18s,background .18s}
.sc-switch input:checked + .tk{background:var(--hatch-widget-accent);border-color:transparent}
.sc-switch input:checked + .tk::after{left:20px;background:#1a1206}
.sc-seg{display:flex;background:#000;border:1px solid var(--hatch-widget-border);border-radius:13px;padding:3px;gap:3px;flex:1}
.sc-seg-btn{flex:1;border:0;background:transparent;color:var(--hatch-widget-muted);font-family:inherit;font-size:13px;font-weight:700;padding:9px 6px;border-radius:10px;cursor:pointer;transition:background .15s,color .15s}
.sc-seg-btn.on{background:var(--hatch-widget-accent);color:var(--hatch-widget-on-accent)}
.sc-actions{display:flex;gap:8px;width:100%}
.sc-btn{flex:1;border:1px solid var(--hatch-widget-border);background:var(--hatch-widget-surface);color:var(--hatch-widget-text);border-radius:15px;padding:13px 8px;font-size:14px;font-weight:700;cursor:pointer;min-height:46px;font-family:inherit;transition:transform .08s}
.sc-btn:active{transform:scale(.97)}
.sc-btn.gold{background:linear-gradient(145deg,#f5c542,#d99a26);border:0;color:#1a1206}
.sc-status{font-size:13px;color:var(--hatch-widget-muted);text-align:center;min-height:20px;padding:0 8px}
.sc-explain{background:var(--hatch-widget-surface);border:1px solid var(--hatch-widget-border);border-left:3px solid var(--hatch-widget-accent);border-radius:14px;padding:12px 16px;font-size:13px;width:100%}
.sc-explain h4{margin:0 0 4px;font-size:14px;color:var(--hatch-widget-accent)}
.sc-explain p{margin:0;color:var(--hatch-widget-text);line-height:1.45}
.sc-hidden{display:none !important}
.sc-modal{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.sc-modal-card{background:var(--hatch-widget-surface);color:var(--hatch-widget-text);border:1px solid var(--hatch-widget-border);border-radius:20px;padding:22px;width:min(92vw,400px);max-height:80vh;overflow:auto;position:relative;box-shadow:var(--hatch-widget-shadow)}
.sc-modal-card h3{margin:0 0 14px;font-size:19px;letter-spacing:.02em}
.sc-x{position:absolute;top:14px;right:14px;min-height:0;padding:8px 14px;font-size:16px;line-height:1}
.sc-tabs{display:flex;gap:6px;margin-bottom:14px;background:#000;border:1px solid var(--hatch-widget-border);border-radius:13px;padding:3px}
.sc-tab{flex:1;min-height:38px;font-size:13px;border:0;background:transparent;color:var(--hatch-widget-muted)}
.sc-tab.on{background:var(--hatch-widget-accent);color:var(--hatch-widget-on-accent)}
.sc-rec{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--hatch-widget-surface-muted);border:1px solid var(--hatch-widget-border);border-radius:12px;padding:11px 13px;margin-bottom:6px;font-size:13px}
.sc-muted{color:var(--hatch-widget-muted);font-size:13px}
.sc-badge{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--hatch-widget-accent);color:var(--hatch-widget-on-accent);font-size:12px;font-weight:700;margin-right:6px}
</style>
<div id="sc-root">
  <div class="sc-brand">
    <div class="sc-logo"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M2.5 6.5 6 10l6-7 6 7 3.5-3.5L20 18.5H4L2.5 6.5z"/></svg></div>
    <h1 class="sc-title">SUPER<span class="gold">CHECKERS</span></h1>
    <p class="sc-sub">International draughts &middot; 10 &times; 10</p>
  </div>
  <div class="sc-infobar">
    <div class="sc-turn"><span class="sc-turn-dot r" id="sc-turn-dot"></span><span id="sc-turn-label">Red to move</span></div>
    <div class="sc-infobar-meta">
      <span class="sc-chip" id="sc-moves">Move 0</span>
      <span class="sc-chip" title="Red pieces captured"><span class="sc-minidot r"></span><span id="sc-cap-r">0</span></span>
      <span class="sc-chip" title="Black pieces captured"><span class="sc-minidot b"></span><span id="sc-cap-b">0</span></span>
    </div>
  </div>
  <div class="sc-area">
    <div class="sc-ranks" id="sc-ranks"></div>
    <div class="sc-board" id="sc-board" role="grid" aria-label="Checkers board"></div>
    <div></div>
    <div class="sc-files" id="sc-files"></div>
  </div>
  <div class="sc-controls">
    <div class="sc-card">
      <div class="sc-card-label">Opponent</div>
      <div class="sc-card-row">
        <label class="sc-switch"><input type="checkbox" id="sc-ai"><span class="tk"></span><span>Play vs AI</span></label>
      </div>
      <div class="sc-card-row sc-hidden" id="sc-depth-row">
        <div class="sc-seg" id="sc-depth" role="group" aria-label="AI difficulty">
          <button class="sc-seg-btn" data-depth="1">Easy</button>
          <button class="sc-seg-btn" data-depth="3">Medium</button>
          <button class="sc-seg-btn" data-depth="5">Hard</button>
        </div>
      </div>
    </div>
    <div class="sc-card">
      <div class="sc-card-label">Rules &amp; help</div>
      <div class="sc-card-row">
        <label class="sc-switch"><input type="checkbox" id="sc-force" checked><span class="tk"></span><span>Force capture &middot; most pieces</span></label>
      </div>
      <div class="sc-card-row">
        <label class="sc-switch"><input type="checkbox" id="sc-teaching"><span class="tk"></span><span>Teaching mode</span></label>
      </div>
    </div>
    <div class="sc-actions">
      <button class="sc-btn" id="sc-undo">Undo</button>
      <button class="sc-btn gold" id="sc-reset">Reset</button>
      <button class="sc-btn" id="sc-stats">Leaderboard</button>
    </div>
    <div class="sc-status" id="sc-status">Loading…</div>
    <div class="sc-explain sc-hidden" id="sc-explain"></div>
  </div>
  <div class="sc-modal sc-hidden" id="sc-modal" role="dialog" aria-label="Leaderboard">
    <div class="sc-modal-card">
      <button class="sc-btn sc-x" id="sc-close" aria-label="Close">&times;</button>
      <h3>Leaderboard</h3>
      <div class="sc-tabs">
        <button class="sc-btn sc-tab on" data-tab="games">Recent games</button>
        <button class="sc-btn sc-tab" data-tab="rank">Top players</button>
      </div>
      <div id="sc-games"></div>
      <div id="sc-rank" class="sc-hidden"></div>
    </div>
  </div>
</div>
<script>
'use strict';
/*ENGINE-START*/
var SC_N = 10;
var SC_DIRS = [[-1,-1],[-1,1],[1,-1],[1,1]];
function scInB(r,c){ return r>=0 && r<SC_N && c>=0 && c<SC_N; }
function scOwner(p){ return p.charAt(0); }            /* 'r' | 'b' */
function scIsQueen(p){ return p.length===2; }          /* 'rq','bq' vs 'r','b' */
function scNewBoard(){
  var b=[], r, c;
  for(r=0;r<SC_N;r++){ b.push([]); for(c=0;c<SC_N;c++) b[r].push(null); }
  for(r=0;r<4;r++) for(c=0;c<SC_N;c++) if(((r+c)%2)===1) b[r][c]='r';
  for(r=6;r<SC_N;r++) for(c=0;c<SC_N;c++) if(((r+c)%2)===1) b[r][c]='b';
  return b;
}
function scClone(b){ return b.map(function(row){ return row.slice(); }); }
/* All capture sequences for the piece at (r,c). Each move: {from,to,path,caps}. */
function scCapturesFor(b,r,c){
  var p=b[r][c]; if(!p) return [];
  var q=scIsQueen(p), me=scOwner(p), out=[], seen={};
  function wasJumped(jumped,mr,mc){
    for(var k=0;k<jumped.length;k++) if(jumped[k][0]===mr&&jumped[k][1]===mc) return true;
    return false;
  }
  function dfs(bd,br,bc,path,caps,jumped){
    var extended=false;
    function leg(lr,lc,mr,mc){
      var nb=scClone(bd);
      nb[br][bc]=null; nb[lr][lc]=p;
      extended=true;
      dfs(nb,lr,lc,path.concat([[lr,lc]]),caps.concat([[mr,mc]]),jumped.concat([[mr,mc]]));
    }
    var d,dr,dc,mr,mc,lr,lc,mid;
    if(!q){
      for(d=0;d<4;d++){
        dr=SC_DIRS[d][0]; dc=SC_DIRS[d][1];
        mr=br+dr; mc=bc+dc; lr=br+2*dr; lc=bc+2*dc;
        if(!scInB(lr,lc)) continue;
        mid=bd[mr][mc];
        if(mid && scOwner(mid)!==me && !bd[lr][lc] && !wasJumped(jumped,mr,mc)) leg(lr,lc,mr,mc);
      }
    }else{
      for(d=0;d<4;d++){
        dr=SC_DIRS[d][0]; dc=SC_DIRS[d][1];
        mr=br+dr; mc=bc+dc;
        while(scInB(mr,mc) && !bd[mr][mc]){ mr+=dr; mc+=dc; }
        if(!scInB(mr,mc)) continue;
        mid=bd[mr][mc];
        if(!mid || scOwner(mid)===me || wasJumped(jumped,mr,mc)) continue;
        lr=mr+dr; lc=mc+dc;
        while(scInB(lr,lc) && !bd[lr][lc]){ leg(lr,lc,mr,mc); lr+=dr; lc+=dc; }
      }
    }
    if(!extended && caps.length){
      var last=path[path.length-1];
      var key=last[0]+','+last[1]+'|'+caps.map(function(x){return x[0]+','+x[1];}).sort().join(';');
      if(!seen[key]){
        seen[key]=1;
        out.push({from:[r,c],to:[last[0],last[1]],path:path.map(function(x){return [x[0],x[1]];}),caps:caps.map(function(x){return [x[0],x[1]];})});
      }
    }
  }
  dfs(scClone(b),r,c,[],[],[]);
  return out;
}
function scQuietMoves(b,r,c){
  var p=b[r][c]; if(!p) return [];
  var q=scIsQueen(p), me=scOwner(p), out=[], d, dr, dc, lr, lc;
  if(!q){
    var fwd = me==='r' ? 1 : -1;
    for(d=0;d<4;d++){
      dr=SC_DIRS[d][0]; dc=SC_DIRS[d][1];
      if(dr!==fwd) continue;
      lr=r+dr; lc=c+dc;
      if(scInB(lr,lc) && !b[lr][lc]) out.push({from:[r,c],to:[lr,lc],path:[[lr,lc]],caps:[]});
    }
  }else{
    for(d=0;d<4;d++){
      dr=SC_DIRS[d][0]; dc=SC_DIRS[d][1];
      lr=r+dr; lc=c+dc;
      while(scInB(lr,lc) && !b[lr][lc]){ out.push({from:[r,c],to:[lr,lc],path:[[lr,lc]],caps:[]}); lr+=dr; lc+=dc; }
    }
  }
  return out;
}
function scAllMoves(b,turn,forceCapture){
  var caps=[], r, c, p;
  for(r=0;r<SC_N;r++) for(c=0;c<SC_N;c++){
    p=b[r][c];
    if(p && scOwner(p)===turn) caps.push.apply(caps, scCapturesFor(b,r,c));
  }
  if(caps.length && forceCapture){
    /* FMJD 4.13: when several captures exist, only the one(s) taking the
       most pieces may be played. */
    var maxc=0, i;
    for(i=0;i<caps.length;i++) if(caps[i].caps.length>maxc) maxc=caps[i].caps.length;
    caps=caps.filter(function(m){ return m.caps.length===maxc; });
    return caps;
  }
  var quiet=[];
  if(!caps.length || !forceCapture){
    for(r=0;r<SC_N;r++) for(c=0;c<SC_N;c++){
      p=b[r][c];
      if(p && scOwner(p)===turn) quiet.push.apply(quiet, scQuietMoves(b,r,c));
    }
  }
  return caps.concat(quiet);
}
function scApplyMove(b,move){
  var nb=scClone(b), i;
  var fr=move.from[0], fc=move.from[1];
  var p=nb[fr][fc];
  nb[fr][fc]=null;
  for(i=0;i<move.caps.length;i++) nb[move.caps[i][0]][move.caps[i][1]]=null;
  var tr=move.to[0], tc=move.to[1], np=p;
  if(!scIsQueen(p)){
    if(scOwner(p)==='r' && tr===SC_N-1) np='rq';
    else if(scOwner(p)==='b' && tr===0) np='bq';
  }
  nb[tr][tc]=np;
  return {board:nb, promoted:np!==p};
}
function scEvaluate(b){
  var s=0, r, c, p, me, q, v;
  for(r=0;r<SC_N;r++) for(c=0;c<SC_N;c++){
    p=b[r][c]; if(!p) continue;
    me=scOwner(p); q=scIsQueen(p);
    v = q?300:100;
    if(!q) v += (me==='r' ? r : (SC_N-1-r))*4;
    v += (4.5-Math.abs(c-4.5))*(q?4:2);
    s += me==='r' ? v : -v;
  }
  return s;
}
var scNodes=0, scDeadline=0;
function scMinimax(b,turn,depth,alpha,beta,forceCapture){
  scNodes++;
  if((scNodes&1023)===0 && Date.now()>scDeadline) return scEvaluate(b);
  if(scNodes>140000) return scEvaluate(b);
  var moves=scAllMoves(b,turn,forceCapture), i, m, nb, v, best;
  if(!moves.length) return turn==='r' ? -100000-depth : 100000+depth;
  if(depth===0) return scEvaluate(b);
  moves.sort(function(a,b2){ return b2.caps.length-a.caps.length; });
  if(turn==='r'){
    best=-Infinity;
    for(i=0;i<moves.length;i++){
      m=moves[i]; nb=scApplyMove(b,m).board;
      v=scMinimax(nb,'b',depth-1,alpha,beta,forceCapture);
      if(v>best) best=v;
      if(best>alpha) alpha=best;
      if(beta<=alpha) break;
    }
    return best;
  }
  best=Infinity;
  for(i=0;i<moves.length;i++){
    m=moves[i]; nb=scApplyMove(b,m).board;
    v=scMinimax(nb,'r',depth-1,alpha,beta,forceCapture);
    if(v<best) best=v;
    if(best<beta) beta=best;
    if(beta<=alpha) break;
  }
  return best;
}
function scBestAIMove(b,depth,forceCapture){
  var moves=scAllMoves(b,'r',forceCapture), i, m, nb, v, best, bestMs;
  if(!moves.length) return null;
  moves.sort(function(a,b2){ return (b2.caps.length-a.caps.length) || (Math.random()-0.5); });
  scNodes=0; scDeadline=Date.now()+1200;
  best=-Infinity; bestMs=[moves[0]];
  for(i=0;i<moves.length;i++){
    m=moves[i]; nb=scApplyMove(b,m).board;
    v=scMinimax(nb,'b',depth-1,-Infinity,Infinity,forceCapture)+m.caps.length*0.01;
    if(v>best+1e-9){ best=v; bestMs=[m]; }
    else if(Math.abs(v-best)<1e-9){ bestMs.push(m); }
  }
  return bestMs[(Math.random()*bestMs.length)|0];
}
/* Can `attacker` capture the piece sitting on (r,c) right now? */
function scSquareAttackedBy(b,r,c,attacker){
  var rr,cc,p,caps,i,j;
  for(rr=0;rr<SC_N;rr++) for(cc=0;cc<SC_N;cc++){
    p=b[rr][cc];
    if(p && scOwner(p)===attacker){
      caps=scCapturesFor(b,rr,cc);
      for(i=0;i<caps.length;i++) for(j=0;j<caps[i].caps.length;j++){
        if(caps[i].caps[j][0]===r && caps[i].caps[j][1]===c) return true;
      }
    }
  }
  return false;
}
/* Does `owner` have another piece (not the one from `exFrom`) that could step onto (r,c)? */
function scDefendedBy(b,r,c,owner,exFrom){
  var nb=scClone(b); nb[r][c]=null; /* the piece standing there must not block its own defenders */
  var rr,cc,p,qm,i;
  for(rr=0;rr<SC_N;rr++) for(cc=0;cc<SC_N;cc++){
    p=nb[rr][cc];
    if(!p || scOwner(p)!==owner) continue;
    if(exFrom && rr===exFrom[0] && cc===exFrom[1]) continue;
    qm=scQuietMoves(nb,rr,cc);
    for(i=0;i<qm.length;i++) if(qm[i].to[0]===r && qm[i].to[1]===c) return true;
  }
  return false;
}
/* Plain-language advice for a chosen hint move. */
function scAdviceFor(w){
  var t,b;
  if(w.caps>0){
    t='Take the pieces';
    b='Grabbing '+w.caps+' enemy piece'+(w.caps>1?'s':'')+' is almost always right. Fewer of theirs means fewer threats to you.';
  }else if(w.promoted){
    t='Crown a queen';
    b='Queens fly any distance and capture in every direction. One queen can run the whole board, so crown one whenever you safely can.';
  }else if(w.hadUnsafeAlt){
    t='Play the safe square';
    b='This piece cannot be taken right away. Never leave a piece hanging where the enemy grabs it for free.';
  }else if(w.defended){
    t='Keep pieces protected';
    b='A teammate covers this square, so your piece is safe standing there. Protected pieces are hard to attack.';
  }else if(w.center){
    t='Own the middle';
    b='Pieces in the center have the most moves and threaten both sides. Drift inward, not toward the edges.';
  }else{
    t='Simple developing move';
    b='Brings a piece into play without risk. Give every move a reason.';
  }
  return {t:t,b:b};
}
/* Teaching heuristic: principle-based move choice with plain advice attached. */
function scHeuristicMove(b,turn,forceCapture){
  var moves=scAllMoves(b,turn,forceCapture), i, m, s, best=null, bs=-1e18;
  var foe = turn==='r' ? 'b' : 'r';
  if(!moves.length) return null;
  var scored=[], hadUnsafeAlt=false;
  for(i=0;i<moves.length;i++){
    m=moves[i];
    var applied=scApplyMove(b,m), nb=applied.board;
    var tr=m.to[0], tc=m.to[1];
    var unsafe=scSquareAttackedBy(nb,tr,tc,foe);
    var defended=scDefendedBy(nb,tr,tc,turn,m.from);
    s = m.caps.length*120 + (applied.promoted?90:0);
    s += unsafe ? -70 : 25;
    if(defended) s += 20;
    s += (4.5-Math.abs(tc-4.5))*4;
    if(scIsQueen(b[m.from[0]][m.from[1]])) s += 10;
    if(unsafe) hadUnsafeAlt=true;
    scored.push({m:m, s:s, unsafe:unsafe, defended:defended, promoted:applied.promoted});
  }
  for(i=0;i<scored.length;i++) if(scored[i].s>bs){ bs=scored[i].s; best=scored[i]; }
  var w={
    caps:best.m.caps.length, promoted:best.promoted,
    safe:!best.unsafe, defended:best.defended,
    hadUnsafeAlt:hadUnsafeAlt && !best.unsafe,
    center:(best.m.to[1]>=3 && best.m.to[1]<=6)
  };
  var adv=scAdviceFor(w);
  w.title=adv.t;
  best.m.hintWhy=w;
  return best.m;
}
/*ENGINE-END*/
/* ================= UI ================= */
var SCW = (typeof window!=='undefined' && window.hatchWidget) ? window.hatchWidget : null;
var scEphemeral = { sel:null, moves:[], hint:null, aiTok:0 };
var S = null;
function scDefaults(){
  return {
    board: scNewBoard(), turn:'r', gameActive:true, moveCount:0, history:[],
    aiToken:0,
    settings:{ ai:false, depth:3, force:true, teaching:false },
    stats:{ games:[], wins:{} },
    status:'Red to move. Tap one of your pieces.', explanation:'', aiThinking:false
  };
}
function scLoadState(){
  var d=scDefaults();
  if(SCW){ S=SCW.getState(d)||d; } else { S=d; }
  S.settings=Object.assign({ai:false,depth:3,force:true,teaching:false}, S.settings||{});
  S.stats=S.stats||{games:[],wins:{}};
  S.history=S.history||[];
  if(typeof S.aiToken!=='number') S.aiToken=0;
}
function scSave(){
  if(SCW){ try{ SCW.setState(S); }catch(e){} }
  scRender();
}
if(SCW && typeof window!=='undefined'){
  window.addEventListener('hatch-widget-state', function(ev){
    if(ev && ev.detail && ev.detail.state){
      S=ev.detail.state;
      scEphemeral.sel=null; scEphemeral.moves=[]; scEphemeral.hint=null;
      scRender();
    }
  });
}
var boardEl=null, sqEls=[];
function scBuildBoard(){
  boardEl=document.getElementById('sc-board');
  boardEl.innerHTML=''; sqEls=[];
  var r,c,d;
  for(r=0;r<SC_N;r++) for(c=0;c<SC_N;c++){
    d=document.createElement('div');
    d.className='sc-sq '+(((r+c)%2===1)?'d':'l');
    d.setAttribute('data-r',r); d.setAttribute('data-c',c);
    boardEl.appendChild(d); sqEls.push(d);
  }
}
var CROWN_SVG='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M2.5 6.5 6 10l6-7 6 7 3.5-3.5L20 18.5H4L2.5 6.5z"/></svg>';
function scRender(){
  if(!sqEls.length) return;
  var hint=scEphemeral.hint, sel=scEphemeral.sel, r, c, el, p, q, key, cls, inner;
  var destKeys={}, capKeys={};
  for(r=0;r<scEphemeral.moves.length;r++){
    var m=scEphemeral.moves[r];
    destKeys[m.to[0]+','+m.to[1]]=1;
  }
  for(r=0;r<10;r++) for(c=0;c<10;c++){
    el=sqEls[r*10+c]; p=S.board[r][c]; key=r+','+c;
    cls='sc-sq '+(((r+c)%2===1)?'d':'l');
    if(sel && sel.r===r && sel.c===c) cls+=' sel';
    else if(hint && hint.from[0]===r && hint.from[1]===c) cls+=' hsrc';
    else if(hint && hint.to[0]===r && hint.to[1]===c) cls+=' hdst';
    else if(hint){
      var hc=hint.caps, i, isCap=false;
      for(i=0;i<hc.length;i++) if(hc[i][0]===r&&hc[i][1]===c){isCap=true;break;}
      if(isCap) cls+=' hcap';
    }
    el.className=cls;
    inner='';
    if(p){
      q=scIsQueen(p);
      inner='<div class="sc-pc '+(scOwner(p)==='r'?'r':'b')+(q?' q':'')+'">'+(q?CROWN_SVG:'')+'</div>';
    }else if(destKeys[key]){
      inner='<div class="sc-dot"></div>';
    }
    el.innerHTML=inner;
  }
  document.getElementById('sc-status').textContent=S.status;
  var ex=document.getElementById('sc-explain');
  if(S.explanation){ ex.innerHTML=S.explanation; ex.classList.remove('sc-hidden'); }
  else { ex.classList.add('sc-hidden'); }
  var aiBox=document.getElementById('sc-ai');
  if(aiBox.checked!==!!S.settings.ai) aiBox.checked=!!S.settings.ai;
  var depRow=document.getElementById('sc-depth-row');
  depRow.classList.toggle('sc-hidden',!S.settings.ai);
  var depBtns=document.getElementById('sc-depth').querySelectorAll('.sc-seg-btn'), bi;
  for(bi=0;bi<depBtns.length;bi++) depBtns[bi].classList.toggle('on',parseInt(depBtns[bi].getAttribute('data-depth'),10)===S.settings.depth);
  var rc=0,bc=0,r2,c2,pp;
  for(r2=0;r2<10;r2++) for(c2=0;c2<10;c2++){ pp=S.board[r2][c2]; if(pp){ if(scOwner(pp)==='r') rc++; else bc++; } }
  document.getElementById('sc-cap-r').textContent=String(20-rc);
  document.getElementById('sc-cap-b').textContent=String(20-bc);
  document.getElementById('sc-moves').textContent='Move '+(Math.floor(S.moveCount/2)+1);
  var tLabel=document.getElementById('sc-turn-label'), tDot=document.getElementById('sc-turn-dot');
  var over=/wins the game|Game over/.test(S.status);
  tLabel.textContent=over?S.status.replace(/\.\s*$/,''):(S.turn==='r'?'Red to move':'Black to move');
  tDot.className='sc-turn-dot '+(S.turn==='r'?'r':'b');
  var fBox=document.getElementById('sc-force');
  if(fBox.checked!==!!S.settings.force) fBox.checked=!!S.settings.force;
  var tBox=document.getElementById('sc-teaching');
  if(tBox.checked!==!!S.settings.teaching) tBox.checked=!!S.settings.teaching;
}
var SC_FILES='ABCDEFGHIJ';
function scSqName(r,c){ return SC_FILES[c]+(r+1); }
function scDescribe(m){
  return scSqName(m.from[0],m.from[1])+' to '+scSqName(m.to[0],m.to[1])+(m.caps.length?' — takes '+m.caps.length:'');
}
function scExplainHtml(m){
  var adv=scAdviceFor(m.hintWhy||{caps:0});
  return '<h4>'+adv.t+'</h4><p>'+adv.b+'</p>';
}
function scRecord(w){
  S.stats.games.unshift({w:w,moves:S.moveCount,at:Date.now(),ai:!!S.settings.ai});
  if(S.stats.games.length>40) S.stats.games.length=40;
  S.stats.wins[w]=(S.stats.wins[w]||0)+1;
}
function scDoMove(m){
  S.history.push({b:JSON.stringify(S.board),t:S.turn,n:S.moveCount});
  if(S.history.length>400) S.history.shift();
  var res=scApplyMove(S.board,m);
  S.board=res.board; S.moveCount++;
  scEphemeral.sel=null; scEphemeral.moves=[]; scEphemeral.hint=null;
  S.turn = S.turn==='r' ? 'b' : 'r';
  var replies=scAllMoves(S.board,S.turn,S.settings.force);
  if(!replies.length){
    S.gameActive=false;
    var w = S.turn==='r' ? 'Black' : 'Red';
    scRecord(w);
    S.status=(res.promoted?'Queen crowned. ':'')+w+' wins the game.';
    S.explanation='';
  }else{
    S.status=(res.promoted?'Queen crowned. ':'')+(S.turn==='r'?'Red':'Black')+' to move.';
  }
  scSave();
  if(S.gameActive){
    if(S.settings.teaching) scHint();
    if(S.settings.ai && S.turn==='r') scAI();
  }
}
function scHint(){
  if(!S.gameActive) return;
  var m=scHeuristicMove(S.board,S.turn,S.settings.force);
  if(!m){ S.explanation=''; scSave(); return; }
  scEphemeral.hint=m;
  S.explanation=scExplainHtml(m);
  S.status='Hint: '+scDescribe(m)+' — '+((m.hintWhy&&m.hintWhy.title)||'best move');
  scSave();
}
function scAI(){
  if(!S.gameActive || !S.settings.ai || S.turn!=='r' || S.aiThinking) return;
  var tok=++scEphemeral.aiTok;
  S.aiThinking=true; S.status='AI is thinking…'; scSave();
  setTimeout(function(){
    if(tok!==scEphemeral.aiTok) return;
    S.aiThinking=false;
    if(!S.gameActive || S.turn!=='r'){ scSave(); return; }
    var mv=scBestAIMove(S.board,S.settings.depth,S.settings.force);
    if(mv) scDoMove(mv);
    else { S.gameActive=false; scRecord('Black'); S.status='Black wins the game.'; S.explanation=''; scSave(); }
  },450);
}
function scUndo(){
  scEphemeral.aiTok++;
  var h=S.history.pop();
  if(!h){ S.status='Nothing to undo yet.'; scSave(); return; }
  S.board=JSON.parse(h.b); S.turn=h.t; S.moveCount=h.n;
  S.gameActive=true; S.aiThinking=false;
  scEphemeral.sel=null; scEphemeral.moves=[]; scEphemeral.hint=null;
  S.status='Move undone. '+(S.turn==='r'?'Red':'Black')+' to move.';
  scSave();
  if(S.settings.teaching) scHint();
}
function scReset(){
  scEphemeral.aiTok++;
  var keep={settings:S.settings,stats:S.stats};
  S=scDefaults(); S.settings=keep.settings; S.stats=keep.stats;
  scEphemeral.sel=null; scEphemeral.moves=[]; scEphemeral.hint=null;
  scSave();
  if(S.settings.teaching) scHint();
  if(S.settings.ai && S.turn==='r' && S.gameActive) scAI();
}
function scClick(e){
  var sq=e.target.closest ? e.target.closest('.sc-sq') : null;
  if(!sq) return;
  if(!S.gameActive){ S.status='Game over. Press Reset to play again.'; scSave(); return; }
  if(S.aiThinking) return;
  if(S.settings.ai && S.turn==='r') return;
  var r=parseInt(sq.getAttribute('data-r'),10), c=parseInt(sq.getAttribute('data-c'),10);
  var sel=scEphemeral.sel, i, mv=null;
  if(sel){
    if(sel.r===r && sel.c===c){ scEphemeral.sel=null; scEphemeral.moves=[]; scRender(); return; }
    for(i=0;i<scEphemeral.moves.length;i++){
      if(scEphemeral.moves[i].to[0]===r && scEphemeral.moves[i].to[1]===c){ mv=scEphemeral.moves[i]; break; }
    }
    if(mv){ scDoMove(mv); return; }
  }
  var p=S.board[r][c];
  if(p && scOwner(p)===S.turn){
    var all=scAllMoves(S.board,S.turn,S.settings.force), mine=[];
    for(i=0;i<all.length;i++) if(all[i].from[0]===r && all[i].from[1]===c) mine.push(all[i]);
    if(mine.length){ scEphemeral.sel={r:r,c:c}; scEphemeral.moves=mine; scEphemeral.hint=null; scRender(); return; }
  }
  if(sel){ scEphemeral.sel=null; scEphemeral.moves=[]; scRender(); }
}
function scOpenStats(){
  var g=S.stats.games, i, html;
  if(g.length){
    html='';
    for(i=0;i<Math.min(10,g.length);i++){
      var x=g[i], d=new Date(x.at);
      html+='<div class="sc-rec"><span><b>'+x.w+'</b> won'+(x.ai?' (vs AI)':'')+'</span><span class="sc-muted">'+x.moves+' moves · '+(d.getMonth()+1)+'/'+d.getDate()+'</span></div>';
    }
  }else html='<p class="sc-muted">No finished games yet.</p>';
  document.getElementById('sc-games').innerHTML=html;
  var wins=S.stats.wins||{}, keys=Object.keys(wins).sort(function(a,b){return wins[b]-wins[a];});
  if(keys.length){
    html='';
    for(i=0;i<keys.length;i++) html+='<div class="sc-rec"><span><span class="sc-badge">'+(i+1)+'</span>'+keys[i]+'</span><span>'+wins[keys[i]]+' win'+(wins[keys[i]]===1?'':'s')+'</span></div>';
  }else html='<p class="sc-muted">No wins recorded yet.</p>';
  document.getElementById('sc-rank').innerHTML=html;
  document.getElementById('sc-modal').classList.remove('sc-hidden');
}
function scInitCoords(){
  var rk=document.getElementById('sc-ranks'), fl=document.getElementById('sc-files'), i, d;
  rk.innerHTML=''; fl.innerHTML='';
  for(i=1;i<=SC_N;i++){ d=document.createElement('div'); d.textContent=i; rk.appendChild(d); }
  for(i=0;i<SC_N;i++){ d=document.createElement('div'); d.textContent=SC_FILES[i]; fl.appendChild(d); }
}
function scInit(){
  scLoadState();
  scBuildBoard();
  scInitCoords();
  boardEl.addEventListener('click', scClick);
  document.getElementById('sc-undo').addEventListener('click', scUndo);
  document.getElementById('sc-reset').addEventListener('click', scReset);
  document.getElementById('sc-stats').addEventListener('click', scOpenStats);
  document.getElementById('sc-close').addEventListener('click', function(){ document.getElementById('sc-modal').classList.add('sc-hidden'); });
  document.getElementById('sc-modal').addEventListener('click', function(e){ if(e.target.id==='sc-modal') e.target.classList.add('sc-hidden'); });
  var tabs=document.querySelectorAll('.sc-tab'), i;
  for(i=0;i<tabs.length;i++){
    (function(btn){
      btn.addEventListener('click', function(){
        var all=document.querySelectorAll('.sc-tab'), j;
        for(j=0;j<all.length;j++) all[j].classList.remove('on');
        btn.classList.add('on');
        var t=btn.getAttribute('data-tab');
        document.getElementById('sc-games').classList.toggle('sc-hidden', t!=='games');
        document.getElementById('sc-rank').classList.toggle('sc-hidden', t!=='rank');
      });
    })(tabs[i]);
  }
  document.getElementById('sc-ai').addEventListener('change', function(e){
    scEphemeral.aiTok++;
    S.settings.ai=e.target.checked;
    if(!S.settings.ai) S.aiThinking=false;
    scEphemeral.sel=null; scEphemeral.moves=[]; scEphemeral.hint=null;
    scSave();
    if(S.settings.ai) scAI();
  });
  document.getElementById('sc-depth').addEventListener('click', function(e){
    var b=e.target.closest?e.target.closest('.sc-seg-btn'):null;
    if(!b) return;
    S.settings.depth=parseInt(b.getAttribute('data-depth'),10); scSave();
  });
  document.getElementById('sc-force').addEventListener('change', function(e){
    S.settings.force=e.target.checked;
    scEphemeral.sel=null; scEphemeral.moves=[]; scSave();
  });
  document.getElementById('sc-teaching').addEventListener('change', function(e){
    S.settings.teaching=e.target.checked;
    if(S.settings.teaching){ scHint(); }
    else { S.explanation=''; scEphemeral.hint=null; scSave(); }
  });
  scRender();
  if(S.settings.teaching) scHint();
  if(S.settings.ai && S.turn==='r' && S.gameActive && !S.aiThinking) scAI();
}
scInit();
</script>
